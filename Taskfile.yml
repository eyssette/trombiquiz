# https://taskfile.dev

version: '3'

tasks:
  build:
    desc: Exécute toutes les tâches de construction du bookmarklet et du site explicatif
    aliases:
      - default
    cmds:
      - task: pandoc-convert
      - task: minify-js
      - task: create-bookmarklet

  pandoc-convert:
    desc: Convertit le fichier README.md en index.html avec Pandoc
    sources:
      - README.md
      - index.html
      - pandoc/fr-nbsp.lua
      - pandoc/set-title-from-h1.lua
      - pandoc/style.css
      - pandoc/template.html
      - pandoc/include.lua
    generates:
      - index.html
    cmds:
      - pandoc -f markdown+lists_without_preceding_blankline+emoji -t html -s README.md -o index.html --lua-filter=pandoc/fr-nbsp.lua --lua-filter=pandoc/set-title-from-h1.lua --mathjax --css=\"pandoc/style.css\" --template=pandoc/template.html --lua-filter=pandoc/include.lua
    description: Convert README.md to index.html using Pandoc

  minify-js:
    desc: Minifie le fichier trombiquiz.js en trombiquiz.min.js
    sources:
      - trombiquiz.js
      - trombiquiz.min.js
    generates:
      - trombiquiz.min.js
    cmds:
          - npx terser trombiquiz.js --output trombiquiz.min.js --compress --mangle
    description: Minify trombiquiz.js to trombiquiz.min.js
    
  create-bookmarklet:
    desc: Crée la version bookmarklet de trombiquiz.js
    deps:
      - minify-js
    sources:
      - trombiquizCreateBookmarklet.py
      - trombiquiz.min.js
      - trombiquizBookmarklet.js
    generates:
      - trombiquizBookmarklet.js
    cmds:
      - python3 trombiquizCreateBookmarklet.py
    description: Create bookmarklet version of trombiquiz.js

  push:
    vars:
      GIT_REPO_NAMES: [trombiquiz, github]
    preconditions:
      - test ! -f app/DEBUG
    cmds:
      - for: { var: GIT_REPO_NAMES }
        cmd:  git push {{.ITEM}} && git push {{.ITEM}} --tags